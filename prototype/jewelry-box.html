<!DOCTYPE html>
<html lang="ja">
<head>

<title>Nail Jewelry Box · Demo v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;

    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.6s ease;
  }
  #canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
  
  .header {
    position: fixed; top: 0; left: 0; right: 0;

    pointer-events: none;
  }
  .title {
    font-size: 18px; font-weight: 200; letter-spacing: 6px;
    color: rgba(255,255,255,0.95); text-align: center;
    text-shadow: 0 0 20px rgba(236,64,122,0.3);
  }
  .subtitle {
    font-size: 9px; letter-spacing: 3px; text-align: center;
    color: rgba(255,255,255,0.45); margin-top: 5px;
  }
  
  .skin-info {
    position: fixed; bottom: 80px; left: 0; right: 0;
    text-align: center; z-index: 10;
    pointer-events: none;
    opacity: 0; transition: opacity 0.4s;
  }
  .skin-info.show { opacity: 1; }
  .skin-name {
    font-size: 11px; letter-spacing: 4px; font-weight: 300;
    color: rgba(255,255,255,0.7);
  }
  .skin-desc {
    font-size: 10px; letter-spacing: 1px;
    color: rgba(255,255,255,0.4); margin-top: 4px;
  }
  
  .skin-selector {
    position: fixed; bottom: 24px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 6px;
    z-index: 10; padding: 0 12px;
    flex-wrap: wrap;
  }
  .skin-btn {
    padding: 9px 14px; border-radius: 20px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12); color: white;
    font-size: 10px; cursor: pointer; transition: all 0.3s;
    letter-spacing: 1.5px;
  }
  .skin-btn.active {
    background: rgba(255,255,255,0.95); color: #050308;
    border-color: white;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  
  .counter {
    position: fixed; top: 60px; right: 16px; z-index: 10;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);

    font-size: 10px; letter-spacing: 2px; font-weight: 300;
    color: rgba(255,255,255,0.85);
  }
  
  .layout-toggle {
    position: fixed; top: 60px; left: 16px; z-index: 10;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);

    font-size: 10px; letter-spacing: 2px; font-weight: 300;
    color: rgba(255,255,255,0.85);
    cursor: pointer;
  }
  
  /* 詳細表示 */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 100;
    pointer-events: none;
    opacity: 0; transition: opacity 0.4s;
  }
  .detail-overlay.show { opacity: 1; pointer-events: all; }
  .detail-bg {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(20,10,30,0.4) 0%, rgba(5,3,8,0.95) 100%);

  .detail-card {

  .detail-overlay.show .detail-card { transform: translateY(0); }
  .detail-handle {
    width: 36px; height: 4px; border-radius: 2px;

  .detail-name {

  }
  .detail-date {

  }
  .detail-tags {

  .detail-tag {

  .detail-meta {

    position: absolute; top: 0; left: 0; right: 0; height: 60%;

    opacity: 0; pointer-events: none;

  .toast.show {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
  }
  .toast-title {
    font-size: 12px; letter-spacing: 3px; color: #f8bbd0; margin-bottom: 8px;

  .toast-sub {

    0%, 100% { opacity: 0.4; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 0.7; transform: translate(-50%,-50%) scale(1.05); }
  }

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ============================================

const SAMPLE_NAILS = [

  { id: 9, name: 'Mint Frost', date: '2025.12.22', colors: ['#b2dfdb', '#80cbc4', '#fff'], tags: ['ミント'], shape: 'Round', salon: 'Frosty', price: '¥6,000', sparkle: true },
  { id: 10, name: 'Gold Leaf', date: '2025.12.08', colors: ['#fff8e1', '#ffd54f', '#ff8f00'], tags: ['ゴールド'], shape: 'Almond', salon: 'Aurum', price: '¥9,000', sparkle: true },
  { id: 11, name: 'Lavender Dream', date: '2025.11.25', colors: ['#e1bee7', '#ba68c8', '#7b1fa2'], tags: ['パープル'], shape: 'Oval', salon: 'Violet', price: '¥7,000', sparkle: false },
  { id: 12, name: 'Cherry Blossom', date: '2025.11.10', colors: ['#fce4ec', '#f48fb1', '#fff'], tags: ['花柄', '桜'], shape: 'Almond', salon: 'Sakura', price: '¥7,500', sparkle: false },
  { id: 13, name: 'Coral Sunset', date: '2025.10.28', colors: ['#ff7043', '#ff8a65', '#ffccbc'], tags: ['コーラル', 'グラデ'], shape: 'Oval', salon: 'Sunset', price: '¥7,800', sparkle: false },
  { id: 14, name: 'Emerald Lux', date: '2025.10.12', colors: ['#1b5e20', '#388e3c', '#a5d6a7'], tags: ['グリーン', 'ラグジュアリー'], shape: 'Coffin', salon: 'Jade', price: '¥8,200', sparkle: true },
  { id: 15, name: 'Champagne Fizz', date: '2025.09.30', colors: ['#fff8e1', '#ffe082', '#ffd54f'], tags: ['シャンパン', 'グリッター'], shape: 'Almond', salon: 'Fizzy', price: '¥6,500', sparkle: true },
  { id: 16, name: 'Rose Quartz', date: '2025.09.15', colors: ['#f8bbd0', '#f06292', '#e91e63'], tags: ['ローズ', 'クォーツ'], shape: 'Round', salon: 'Crystal', price: '¥7,000', sparkle: false },
  { id: 17, name: 'Midnight Navy', date: '2025.09.01', colors: ['#0d47a1', '#1565c0', '#42a5f5'], tags: ['ネイビー', 'マット'], shape: 'Square', salon: 'Deep Blue', price: '¥5,800', sparkle: false },
  { id: 18, name: 'Blush & Gold', date: '2025.08.20', colors: ['#fce4ec', '#f8bbd0', '#ffd700'], tags: ['ブラッシュ', 'ゴールド'], shape: 'Stiletto', salon: 'Gilded', price: '¥9,500', sparkle: true },
  { id: 19, name: 'Sage Mist', date: '2025.08.05', colors: ['#8d9e60', '#aed581', '#e8f5e9'], tags: ['セージ', 'アース'], shape: 'Oval', salon: 'Botanica', price: '¥6,200', sparkle: false },
  { id: 20, name: 'Deep Plum', date: '2025.07.22', colors: ['#4a148c', '#7b1fa2', '#ab47bc'], tags: ['プラム', 'ダーク'], shape: 'Coffin', salon: 'Noir', price: '¥7,500', sparkle: false },
];

const SKIN_INFO = {
  glass: { name: 'GLASS CASE', desc: 'Pure crystal display', bg: '#050308' },
  snow: { name: 'SNOW GLOBE', desc: 'Winter memories floating', bg: '#020812' },
  velvet: { name: 'VELVET BOX', desc: 'Luxurious heritage', bg: '#0f0308' },
  showcase: { name: 'SHOWCASE', desc: 'Boutique collection', bg: '#08060f' },
};

// ============================================
// シーン
// ============================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);

// ============================================
// 環境マッピング（疑似HDRI - PMREMで生成）
// ============================================
const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

function createEnvironmentTexture() {
  const size = 256;
  const data = new Uint8Array(size * size * 4);
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      const idx = (i * size + j) * 4;
      const v = i / size;
      // 上が明るく、下に向かってピンクのグラデ
      const r = Math.floor(180 + v * 50 + Math.sin(j * 0.1) * 20);
      const g = Math.floor(100 + v * 80);
      const b = Math.floor(140 + v * 80);
      data[idx] = Math.min(255, r);
      data[idx + 1] = Math.min(255, g);
      data[idx + 2] = Math.min(255, b);
      data[idx + 3] = 255;
    }
  }
  const texture = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  texture.needsUpdate = true;
  texture.mapping = THREE.EquirectangularReflectionMapping;
  return pmremGenerator.fromEquirectangular(texture).texture;
}

const envMap = createEnvironmentTexture();
scene.environment = envMap;

// ============================================
// ライティング（より豪華に）
// ============================================
const ambient = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffe0f0, 1.5);
keyLight.position.set(3, 5, 5);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x88aaff, 0.8);
rimLight.position.set(-3, 2, -3);
scene.add(rimLight);

const accentLight1 = new THREE.PointLight(0xff80ab, 1.2, 12);
accentLight1.position.set(2, 1, 3);
scene.add(accentLight1);

const accentLight2 = new THREE.PointLight(0xb088ff, 0.8, 10);
accentLight2.position.set(-2, -1, 2);
scene.add(accentLight2);

// 上からのスポット光（高級感の鍵）
const spotLight = new THREE.SpotLight(0xffffff, 1.0, 15, Math.PI / 6, 0.4, 1);
spotLight.position.set(0, 6, 2);
spotLight.target.position.set(0, 0, 0);
scene.add(spotLight);
scene.add(spotLight.target);

// ============================================
// 爪型ジオメトリ（薄く、自然に）
// ============================================
function createNailGeometry() {
  const shape = new THREE.Shape();
  const w = 0.55, h = 0.85;
  // 自然な爪のシルエット（先端少しシャープ）
  shape.moveTo(0, -h);
  shape.bezierCurveTo(w * 0.95, -h * 0.95, w * 1.0, -h * 0.2, w * 0.88, h * 0.5);
  shape.bezierCurveTo(w * 0.7, h * 0.92, w * 0.3, h * 1.0, 0, h * 1.0);
  shape.bezierCurveTo(-w * 0.3, h * 1.0, -w * 0.7, h * 0.92, -w * 0.88, h * 0.5);
  shape.bezierCurveTo(-w * 1.0, -h * 0.2, -w * 0.95, -h * 0.95, 0, -h);
  
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.04,                  // ずっと薄く（0.18 → 0.04）
    bevelEnabled: true,
    bevelThickness: 0.025,         // ベベルも薄く
    bevelSize: 0.025,
    bevelSegments: 6,
    curveSegments: 32,
  });
  
  // 爪の凸カーブを再現（頂点を曲げる）
  const positions = geometry.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    // 中央が最も盛り上がるカーブ
    const curve = Math.cos((x / 0.6) * Math.PI / 2) * Math.cos((y / 0.9) * Math.PI / 3) * 0.08;
    if (z > 0) positions.setZ(i, z + curve);
  }
  positions.needsUpdate = true;
  geometry.computeVertexNormals();
  geometry.center();
  
  return geometry;
}

const nailGeometry = createNailGeometry();

// ゴールドフレーム用のジオメトリ（細い枠）
function createFrameGeometry() {
  const shape = new THREE.Shape();
  const w = 0.58, h = 0.88;
  shape.moveTo(0, -h);
  shape.bezierCurveTo(w * 0.95, -h * 0.95, w * 1.0, -h * 0.2, w * 0.88, h * 0.5);
  shape.bezierCurveTo(w * 0.7, h * 0.92, w * 0.3, h * 1.0, 0, h * 1.0);
  shape.bezierCurveTo(-w * 0.3, h * 1.0, -w * 0.7, h * 0.92, -w * 0.88, h * 0.5);
  shape.bezierCurveTo(-w * 1.0, -h * 0.2, -w * 0.95, -h * 0.95, 0, -h);
  
  const inner = new THREE.Path();
  const wi = 0.50, hi = 0.78;
  inner.moveTo(0, -hi);
  inner.bezierCurveTo(wi * 0.95, -hi * 0.95, wi * 1.0, -hi * 0.2, wi * 0.88, hi * 0.5);
  inner.bezierCurveTo(wi * 0.7, hi * 0.92, wi * 0.3, hi * 1.0, 0, hi * 1.0);
  inner.bezierCurveTo(-wi * 0.3, hi * 1.0, -wi * 0.7, hi * 0.92, -wi * 0.88, hi * 0.5);
  inner.bezierCurveTo(-wi * 1.0, -hi * 0.2, -wi * 0.95, -hi * 0.95, 0, -hi);
  shape.holes.push(inner);
  
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.06,
    bevelEnabled: true,
    bevelThickness: 0.015,
    bevelSize: 0.015,
    bevelSegments: 4,
    curveSegments: 24,
  });
  geo.center();
  return geo;
}

const frameGeometry = createFrameGeometry();

// ============================================
// 爪オブジェクト生成
// ============================================
function createNailTexture(nailData) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  
  if (nailData.colors.length >= 2) {
    const gradient = ctx.createLinearGradient(0, 0, 512, 512);
    nailData.colors.forEach((c, i) => {
      gradient.addColorStop(i / (nailData.colors.length - 1), c);
    });
    ctx.fillStyle = gradient;
  } else {
    ctx.fillStyle = nailData.colors[0];
  }
  ctx.fillRect(0, 0, 512, 512);
  
  // ハイライト（爪のツヤ）
  const highlight = ctx.createRadialGradient(180, 120, 20, 180, 120, 200);
  highlight.addColorStop(0, 'rgba(255,255,255,0.4)');
  highlight.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = highlight;
  ctx.fillRect(0, 0, 512, 512);
  
  // ラメ
  if (nailData.sparkle) {
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const size = Math.random() * 3 + 0.5;
      const alpha = Math.random() * 0.9 + 0.1;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
      // 十字キラ
      if (Math.random() > 0.7) {
        ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.6})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(x - size * 3, y); ctx.lineTo(x + size * 3, y);
        ctx.moveTo(x, y - size * 3); ctx.lineTo(x, y + size * 3);
        ctx.stroke();
      }
    }
  }
  
  const texture = new THREE.CanvasTexture(cv);
  texture.encoding = THREE.sRGBEncoding;
  return texture;
}

function createNailObject(nailData, index) {
  const group = new THREE.Group();

  // メインの爪（カスタム写真テクスチャ優先）
  const texture = nailData._customTexture || createNailTexture(nailData);
  const material = new THREE.MeshPhysicalMaterial({
    map: texture,
    metalness: nailData.sparkle ? 0.5 : 0.15,
    roughness: 0.1,
    clearcoat: 1.0,
    clearcoatRoughness: 0.05,
    reflectivity: 0.9,
    envMap: envMap,
    envMapIntensity: 1.2,
  });
  const nail = new THREE.Mesh(nailGeometry, material);
  group.add(nail);
  
  // ゴールドフレーム
  const frameMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffd700,
    metalness: 1.0,
    roughness: 0.15,
    envMap: envMap,
    envMapIntensity: 1.5,
  });
  const frame = new THREE.Mesh(frameGeometry, frameMaterial);
  frame.position.z = -0.01;
  group.add(frame);
  
  group.userData = { nailData, index, mainMesh: nail };
  group.scale.setScalar(0.65);
  return group;
}

let currentLayout = 'sphere'; // sphere | grid | spiral

function applyLayout(mode) {
  currentLayout = mode;
  nailObjects.forEach((obj, i) => {
    let x, y, z;
    if (mode === 'sphere') {
      const phi = Math.acos(1 - 2 * (i + 0.5) / SAMPLE_NAILS.length);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const radius = 2.4 + Math.random() * 0.3;
      x = radius * Math.sin(phi) * Math.cos(theta);
      y = radius * Math.sin(phi) * Math.sin(theta);
      z = radius * Math.cos(phi);
    } else if (mode === 'grid') {
      const cols = 4;
      const col = i % cols;
      const row = Math.floor(i / cols);
      x = (col - cols / 2 + 0.5) * 1.3;
      y = (1 - row) * 1.5;
      z = 0;
    } else if (mode === 'spiral') {
      const angle = i * 0.7;
      const radius = 0.5 + i * 0.18;
      x = radius * Math.cos(angle);
      y = (i - SAMPLE_NAILS.length / 2) * 0.3;
      z = radius * Math.sin(angle);
    }
    
    obj.userData.basePosition = new THREE.Vector3(x, y, z);
    obj.userData.floatOffset = Math.random() * Math.PI * 2;
    obj.userData.rotSpeed = {
      x: (Math.random() - 0.5) * 0.004,
      y: (Math.random() - 0.5) * 0.004,
      z: (Math.random() - 0.5) * 0.004,
    };
    if (mode === 'grid') {
      obj.rotation.set(0, 0, 0);
      obj.userData.targetRotation = { x: 0, y: 0, z: 0 };
    } else {
      obj.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    }
  });
}

function createGlassSkin() {
  const group = new THREE.Group();
  
  // 床（薄く反射）
  const floorGeo = new THREE.CircleGeometry(8, 64);
  const floorMat = new THREE.MeshPhysicalMaterial({
    color: 0x0a0510,
    metalness: 0.9,
    roughness: 0.3,
    envMap: envMap,
    envMapIntensity: 0.3,
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  group.add(floor);
  
  // 浮遊する光の粒子（大きめ・少なめ＝高級感）
  const dustGeo = new THREE.BufferGeometry();
  const dustCount = 60;
  const positions = new Float32Array(dustCount * 3);
  const velocities = [];
  for (let i = 0; i < dustCount; i++) {
    positions[i*3] = (Math.random() - 0.5) * 12;
    positions[i*3+1] = (Math.random() - 0.5) * 8;
    positions[i*3+2] = (Math.random() - 0.5) * 6;
    velocities.push({
      x: (Math.random() - 0.5) * 0.002,
      y: Math.random() * 0.003 + 0.001,
      z: (Math.random() - 0.5) * 0.002,
    });
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const dustMat = new THREE.PointsMaterial({
    color: 0xffd0e8, size: 0.04,
    transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending,
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  dust.userData.velocities = velocities;
  group.add(dust);
  
  return { group, particles: dust };
}

// Velvet: ベルベット内張りのジュエリーボックス（豪華に）
function createVelvetSkin() {
  const group = new THREE.Group();
  
  // ベルベット内側
  const innerGeo = new THREE.BoxGeometry(6.5, 6.5, 6.5);
  const innerMat = new THREE.MeshStandardMaterial({
    color: 0x5a0e2a,
    roughness: 0.95,
    metalness: 0.05,
    side: THREE.BackSide,
  });
  const inner = new THREE.Mesh(innerGeo, innerMat);
  group.add(inner);
  
  // ゴールドフレーム（実体）
  const frameThickness = 0.08;
  const frameSize = 6.55;
  const goldMat = new THREE.MeshPhysicalMaterial({
    color: 0xffd700,
    metalness: 1.0,
    roughness: 0.15,
    envMap: envMap,
    envMapIntensity: 1.5,
  });
  
  // 12本のフレームエッジ
  const edgePositions = [
    // 縦4本
    [[-frameSize/2, -frameSize/2, frameSize/2], [-frameSize/2, frameSize/2, frameSize/2]],
    [[ frameSize/2, -frameSize/2, frameSize/2], [ frameSize/2, frameSize/2, frameSize/2]],
    [[-frameSize/2, -frameSize/2, -frameSize/2], [-frameSize/2, frameSize/2, -frameSize/2]],
    [[ frameSize/2, -frameSize/2, -frameSize/2], [ frameSize/2, frameSize/2, -frameSize/2]],
    // 上の4本
    [[-frameSize/2, frameSize/2, frameSize/2], [ frameSize/2, frameSize/2, frameSize/2]],
    [[-frameSize/2, frameSize/2, -frameSize/2], [ frameSize/2, frameSize/2, -frameSize/2]],
    [[-frameSize/2, frameSize/2, -frameSize/2], [-frameSize/2, frameSize/2, frameSize/2]],
    [[ frameSize/2, frameSize/2, -frameSize/2], [ frameSize/2, frameSize/2, frameSize/2]],
    // 下の4本
    [[-frameSize/2, -frameSize/2, frameSize/2], [ frameSize/2, -frameSize/2, frameSize/2]],
    [[-frameSize/2, -frameSize/2, -frameSize/2], [ frameSize/2, -frameSize/2, -frameSize/2]],
    [[-frameSize/2, -frameSize/2, -frameSize/2], [-frameSize/2, -frameSize/2, frameSize/2]],
    [[ frameSize/2, -frameSize/2, -frameSize/2], [ frameSize/2, -frameSize/2, frameSize/2]],
  ];
  edgePositions.forEach(([a, b]) => {
    const len = Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]);
    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(frameThickness, frameThickness, len, 8),
      goldMat
    );
    cyl.position.set((a[0]+b[0])/2, (a[1]+b[1])/2, (a[2]+b[2])/2);
    cyl.lookAt(b[0], b[1], b[2]);
    cyl.rotateX(Math.PI / 2);
    group.add(cyl);
  });
  
  return { group, particles: null };
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let dragging = false;
let lastX = 0, lastY = 0;
let velX = 0, velY = 0;
let rotX = 0, rotY = 0;
let touchStartTime = 0;
let touchStartPos = { x: 0, y: 0 };

function onPointerDown(e) {
  if (focusedNail) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  dragging = true;
  lastX = x; lastY = y;
  touchStartTime = Date.now();
  touchStartPos = { x, y };
}

function onPointerMove(e) {
  if (!dragging || focusedNail) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  const y = e.touches ? e.touches[0].clientY : e.clientY;
  const dx = x - lastX;
  const dy = y - lastY;
  velX = dy * 0.005;
  velY = dx * 0.005;
  lastX = x; lastY = y;
}

function onPointerUp(e) {
  if (focusedNail) return;
  dragging = false;
  const x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
  const dt = Date.now() - touchStartTime;
  const moveDist = Math.hypot(x - touchStartPos.x, y - touchStartPos.y);
  
  if (dt < 250 && moveDist < 10) {
    handleTap(x, y);
  }
}

function handleTap(x, y) {
  mouse.x = (x / window.innerWidth) * 2 - 1;
  mouse.y = -(y / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // グループのメインメッシュをチェック
  const meshes = nailObjects.map(g => g.userData.mainMesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    const groupIdx = nailObjects.findIndex(g => g.userData.mainMesh === hits[0].object);
    if (groupIdx >= 0) showDetail(nailObjects[groupIdx]);
  }
}

let focusedNail = null;

function showDetail(nailObj) {
  const data = nailObj.userData.nailData;
  
  // データ反映
  document.getElementById('detailName').textContent = data.name;
  document.getElementById('detailDate').textContent = data.date;
  document.getElementById('metaShape').textContent = data.shape;
  document.getElementById('metaSalon').textContent = data.salon;
  document.getElementById('metaPrice').textContent = data.price;
  
  const tagsEl = document.getElementById('detailTags');
  tagsEl.innerHTML = '';
  data.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'detail-tag';
    span.textContent = t;
    tagsEl.appendChild(span);
  });
  
  // 元の位置を保存して中央に
  focusedNail = nailObj;
  focusedOriginalPos = nailObj.position.clone();
  focusedOriginalRot = nailObj.rotation.clone();
  focusedOriginalScale = nailObj.scale.clone();
  
  // 他の爪を暗く
  nailObjects.forEach(o => {
    if (o !== nailObj) {
      o.traverse(c => {
        if (c.material) {
          c.userData.origOpacity = c.material.opacity;
          c.material.transparent = true;
          c.material.opacity = 0.15;
        }
      });
    }
  });
  
  document.getElementById('detailOverlay').classList.add('show');
}

function hideDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
  
  // 他の爪を戻す
  nailObjects.forEach(o => {
    o.traverse(c => {
      if (c.material && c.userData.origOpacity !== undefined) {
        c.material.opacity = c.userData.origOpacity;
        c.material.transparent = false;
      }
    });
  });
  
  focusedNail = null;
}

// ============================================
// アニメーション
// ============================================
const clock = new THREE.Clock();
const focusTargetPos = new THREE.Vector3(0, 0, 4);

function animate() {
  const t = clock.getElapsedTime();
  
  if (!focusedNail) {
    // 通常時：グループ全体の回転
    if (!dragging) {
      velX *= 0.95; velY *= 0.95;
    }
    rotX += velX;
    rotY += velY;
    velX *= 0.95; velY *= 0.95;
    nailGroup.rotation.x = rotX;
    nailGroup.rotation.y = rotY + (currentLayout === 'sphere' ? t * 0.05 : 0);
    
    // 各爪の浮遊
    nailObjects.forEach((m) => {
      const base = m.userData.basePosition;
      const off = m.userData.floatOffset;
      m.position.x = base.x + Math.sin(t * 0.8 + off) * 0.05;
      m.position.y = base.y + Math.cos(t * 0.6 + off) * 0.08;
      m.position.z = base.z + Math.sin(t * 0.7 + off) * 0.05;
      if (currentLayout !== 'grid') {
        m.rotation.x += m.userData.rotSpeed.x;
        m.rotation.y += m.userData.rotSpeed.y;
        m.rotation.z += m.userData.rotSpeed.z;
      } else {
        // グリッドではゆっくり傾く
        m.rotation.y = Math.sin(t * 0.3 + off) * 0.3;
        m.rotation.x = Math.cos(t * 0.4 + off) * 0.15;
      }
    });
  } else {
    // フォーカス時：選んだ爪を中央へ（スムーズ演出）
    nailGroup.rotation.x += (0 - nailGroup.rotation.x) * 0.08;
    nailGroup.rotation.y += (0 - nailGroup.rotation.y) * 0.08;

    const localTarget = new THREE.Vector3(0, 0.25, 4.5).applyMatrix4(nailGroup.matrixWorld.clone().invert());
    focusedNail.position.lerp(localTarget, 0.12);
    // ゆったりした自転（y軸のみ）
    focusedNail.rotation.y += 0.012;
    focusedNail.rotation.x += (0 - focusedNail.rotation.x) * 0.05;
    focusedNail.rotation.z += (0 - focusedNail.rotation.z) * 0.05;
    focusedNail.scale.lerp(new THREE.Vector3(1.8, 1.8, 1.8), 0.12);

    // フォーカスライト強化
    focusLight.intensity += (2.5 - focusLight.intensity) * 0.1;
    focusRimLight.intensity += (1.2 - focusRimLight.intensity) * 0.1;
  }
  if (!focusedNail) {
    focusLight.intensity += (0 - focusLight.intensity) * 0.15;
    focusRimLight.intensity += (0 - focusRimLight.intensity) * 0.15;
  }
  
  // 粒子更新
  if (currentSkin === 'snow' && skinObjects.snow.particles) {
    const snow = skinObjects.snow.particles;
    const positions = snow.geometry.attributes.position.array;
    const velocities = snow.userData.velocities;
    for (let i = 0; i < velocities.length; i++) {
      positions[i*3] += velocities[i].x;
      positions[i*3+1] += velocities[i].y;
      positions[i*3+2] += velocities[i].z;
      const dist = Math.hypot(positions[i*3], positions[i*3+1], positions[i*3+2]);
      if (dist > 3.3 || positions[i*3+1] < -3) {
        positions[i*3] = (Math.random() - 0.5) * 4;
        positions[i*3+1] = 3;
        positions[i*3+2] = (Math.random() - 0.5) * 4;
      }
    }
    snow.geometry.attributes.position.needsUpdate = true;
  }
  
  if (currentSkin === 'glass' && skinObjects.glass.particles) {
    const dust = skinObjects.glass.particles;
    const positions = dust.geometry.attributes.position.array;
    const velocities = dust.userData.velocities;
    for (let i = 0; i < velocities.length; i++) {
      positions[i*3] += velocities[i].x;
      positions[i*3+1] += velocities[i].y;
      positions[i*3+2] += velocities[i].z;
      if (positions[i*3+1] > 5) {
        positions[i*3+1] = -4;
        positions[i*3] = (Math.random() - 0.5) * 12;
      }
    }
    dust.geometry.attributes.position.needsUpdate = true;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================
// 写真アップロード（自分のネイル写真をコレクションに追加）
// NOTE: 将来 Nano Banana 2 API を経由して美化変換したものをテクスチャとして使う
// ============================================
document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  const url = URL.createObjectURL(file);
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = url;
  });

  // 正方形クロップ → 512px テクスチャ
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  const s = Math.min(img.width, img.height);
  const sx = (img.width - s) / 2;
  const sy = (img.height - s) / 2;
  ctx.drawImage(img, sx, sy, s, s, 0, 0, 512, 512);
  URL.revokeObjectURL(url);

  // ツヤハイライト追加
  const hl = ctx.createRadialGradient(170, 110, 10, 170, 110, 220);
  hl.addColorStop(0, 'rgba(255,255,255,0.28)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl;
  ctx.fillRect(0, 0, 512, 512);

  const texture = new THREE.CanvasTexture(cv);
  texture.encoding = THREE.sRGBEncoding;

  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const newNailData = {
    id: Date.now(),
    name: 'My Nail',
    date: dateStr,
    colors: ['#f8bbd0'],
    tags: ['マイコレクション'],
    shape: 'Custom',
    salon: '—',
    price: '—',
    sparkle: false,
    _customTexture: texture,
  };

  const newObj = createNailObject(newNailData, SAMPLE_NAILS.length);
  SAMPLE_NAILS.push(newNailData);
  nailObjects.push(newObj);
  nailGroup.add(newObj);

  // 中央から登場するアニメーション
  newObj.scale.setScalar(0);
  newObj.position.set(0, 0, 0);
  applyLayout(currentLayout);

  // スケールアニメーション
  let scaleT = 0;
  const growInterval = setInterval(() => {
    scaleT = Math.min(scaleT + 0.05, 1);
    const ease = 1 - Math.pow(1 - scaleT, 3);
    newObj.scale.setScalar(0.65 * ease);
    if (scaleT >= 1) clearInterval(growInterval);
  }, 16);

  document.getElementById('counter').textContent = `${SAMPLE_NAILS.length} / 30`;

  // トースト表示
  const toast = document.getElementById('toast');
  document.getElementById('toastSub').textContent = `My Nail · ${dateStr}`;
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
});

animate();

setTimeout(() => {
  document.getElementById('loading').classList.add('hide');
}, 1000);
</script>

</body>
