name: Agent PR Review Router

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  annotate-agent-pr:
    name: Annotate agent pull request
    if: >
      github.event.action == 'opened' ||
      github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest

    steps:
      - name: Add agent PR labels and guidance
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_AW_AGENT_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const labels = new Set((pr.labels || []).map((label) => label.name));
            const author = pr.user?.login || "";
            const lowerAuthor = author.toLowerCase();
            const lowerHead = (pr.head?.ref || "").toLowerCase();

            const isJules =
              lowerAuthor.includes("jules") ||
              lowerAuthor.includes("google-labs") ||
              lowerHead.includes("jules");

            const addLabels = [];
            if (isJules && !labels.has("jules-pr")) addLabels.push("jules-pr");

            if (addLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: addLabels,
              });
            }

            const marker = "<!-- agent-pr-review-router-guidance -->";
            const body = [
              "## Agent PR next steps",
              "",
              isJules
                ? "This PR appears to be from Jules. Wait for CI, then use maintainer review and merge judgment."
                : "Wait for CI, then use maintainer review and merge judgment.",
              "",
              "Expected PR flow:",
              "",
              "```text",
              "PR opened",
              "  -> CI runs",
              "  -> maintainer review",
              "  -> fix comments if needed",
              "  -> human or explicitly-approved agent merge",
              "```",
              "",
              marker,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body,
              });
            }
