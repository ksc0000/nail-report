name: Nailous
options:
  bundleIdPrefix: com.ksc0000
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Nailous:
    type: application
    platform: iOS
    sources:
      - Nailous
      - path: BenchmarkAssets
        buildPhase: resources
        excludes:
          - "generate_assets.py"
          - "angles"
    info:
      path: Nailous/Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: 作成したネイルの動画や画像を写真に保存するために使用します
        NSCameraUsageDescription: ネイルを撮影して3Dで記録するためにカメラを使用します
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationQueriesSchemes: [instagram-stories]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ksc0000.nailous
        DEVELOPMENT_TEAM: 353B24QC3Y
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
